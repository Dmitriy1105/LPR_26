name: Generate synthetic bank v3.2 and Bitrix24 fixtures

on:
  workflow_dispatch:
  push:
    branches:
      - feature/synthetic-bank-v3.2-scenario-diversity
    paths:
      - "scripts/generate_synthetic_bank_v3_2.mjs"
      - "scripts/generate_bitrix24_contract_fixtures_v2.mjs"
      - "tests/synthetic_bank_v3_2.test.mjs"
      - ".github/workflows/generate-synthetic-bank-v3_2.yml"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3.2 experiment branch
        uses: actions/checkout@v4
        with:
          ref: feature/synthetic-bank-v3.2-scenario-diversity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate normalized synthetic dataset v3.2
        run: node scripts/generate_synthetic_bank_v3_2.mjs

      - name: Generate Bitrix24 REST-compatible fixtures
        run: node scripts/generate_bitrix24_contract_fixtures_v2.mjs

      - name: Validate v3.1 baseline and v3.2 experiment
        run: |
          node --test tests/synthetic_bank_v3.test.mjs
          node --test tests/synthetic_bank_v3_2.test.mjs

      - name: Commit generated datasets and REST fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/synthetic/bank_ml_v3.json
          git add src/data/synthetic/bank_ml_v3_ground_truth.json
          git add src/data/bitrix24_contract_v2
          git diff --cached --quiet || git commit -m "Generate synthetic bank v3.2 scenario-diverse dataset and REST fixtures"
          git push
