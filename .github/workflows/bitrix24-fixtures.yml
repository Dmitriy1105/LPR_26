name: Bitrix24 fixture quality
on:
  push:
    branches: [feature/bitrix24-fixtures-qc]
  pull_request:
  workflow_dispatch:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical REST fixture pages with versioned text overlays
        run: node scripts/generate_bitrix24_contract_fixtures.mjs
      - name: Validate regenerated REST text and missing-data scenarios
        run: node --test tests/bitrix24RestTextIntegrity.test.mjs tests/bitrix24RestNlpExtraction.test.mjs
      - name: Generate linked NLP text corpus
        run: node scripts/generate_bitrix24_nlp_corpus.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bitrix24-synthetic-nlp-corpus
          path: src/data/synthetic/bank_nlp_corpus_v1.json
      - name: Run fixture and application tests
        run: npm test
      - name: Install dependencies (repository has no committed lockfile)
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build
