name: Process model QC
on:
  workflow_dispatch:
  push:
    branches: [feature/generator-v4-bpmn-dmn]
    paths: ['models/**', 'scripts/validate_process_profile.py', 'scripts/process_executor_v4.py', 'scripts/test_process_library.py', 'scripts/organization_decision_audit.py', 'scripts/corporate_decision_v4.py', 'scripts/budget_escalation_v4.py', 'scripts/corporate_multilevel_v4.py', 'scripts/audit_model_links.py', 'scripts/audit_official_xsd.py', '.github/workflows/process-model-qc.yml']
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_process_profile.py > process-qc.json
      - run: python scripts/process_executor_v4.py > executor-qc.json
      - run: python scripts/test_process_library.py > library-qc.json
      - run: python scripts/organization_decision_audit.py > decision-audit-qc.json
      - run: python scripts/corporate_decision_v4.py > corporate-decision-qc.json
      - run: python scripts/budget_escalation_v4.py > escalation-qc.json
      - run: python scripts/corporate_multilevel_v4.py > multilevel-qc.json
      - run: python scripts/audit_model_links.py > model-links-qc.json
      - run: pip install lxml==5.4.0
      - run: python scripts/audit_official_xsd.py > official-xsd-qc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-qc
          path: |
            process-qc.json
            executor-qc.json
            library-qc.json
            decision-audit-qc.json
            corporate-decision-qc.json
            escalation-qc.json
            multilevel-qc.json
            model-links-qc.json
            official-xsd-qc.json
