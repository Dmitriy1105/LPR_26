name: Process model QC
on:
  workflow_dispatch:
  push:
    branches: [feature/generator-v4-bpmn-dmn, feature/generator-v4-organization-engine]
    paths: ['models/**', 'scripts/organization_engine_v1.py', 'scripts/roles_competencies_v1.py', 'scripts/temporal_authority_v1.py', 'scripts/financial_authority_v1.py', 'scripts/delegation_authority_v1.py', 'scripts/organizational_changes_v1.py', 'scripts/event_chronology_v1.py', 'scripts/organization_process_integration_v1.py', 'scripts/organization_engine_qc_v1.py', 'scripts/test_organization_engine_qc_v1.py', 'scripts/organization_integration_audit_v1.py', 'scripts/test_organization_integration_audit_v1.py', 'scripts/event_journal_equivalence_v1.py', 'scripts/test_event_journal_equivalence_v1.py', 'scripts/decision_authority_reconciliation_v1.py', 'scripts/test_decision_authority_reconciliation_v1.py', 'scripts/test_organization_process_integration_v1.py', 'scripts/test_event_chronology_v1.py', 'scripts/test_organization_process_integration_v1.py', 'scripts/test_organizational_changes_v1.py', 'scripts/test_delegation_authority_v1.py', 'scripts/test_financial_authority_v1.py', 'scripts/test_temporal_authority_v1.py', 'scripts/test_roles_competencies_v1.py', 'scripts/test_organization_engine_v1.py', 'docs/ARCHITECTURE_BASELINE_V1.md', 'docs/ORGANIZATION_ENGINE_BASELINE_V1.md', 'reports/organization_engine_baseline_v1.json', 'docs/ARCHITECTURE_LIMITATIONS.md', 'reports/architecture_qc_report.json', 'scripts/test_independent_semantic_audit.py', 'scripts/historical_replay_v1.py', 'scripts/test_historical_replay_v1.py', 'scripts/registry_consolidation.py', 'scripts/test_registry_consolidation.py', 'scripts/test_extended_dmn_negative.py', 'scripts/universal_bpmn_engine.py', 'scripts/budget_policy_v1.py', 'scripts/authority_execution_v1.py', 'scripts/test_authoritative_execution.py', 'scripts/test_event_trace_v1.py', 'scripts/process_replay_v1.py', 'scripts/test_process_replay_v1.py', 'scripts/bpmn_qname.py', 'scripts/test_bpmn_qname.py', 'scripts/test_semantic_trace_equivalence.py', 'scripts/test_declarative_authority.py', 'scripts/test_extended_negative.py', 'scripts/test_task_assignment_v1.py', 'scripts/task_assignment_v1.py', 'scripts/validate_organization_v1.py', 'reports/architecture_defect_registry.json', 'scripts/test_universal_bpmn_engine.py', 'scripts/test_nested_process_audit.py', 'scripts/test_authority_actor.py', 'scripts/test_decision_evidence_v2.py', 'scripts/dmn_interpreter.py', 'scripts/test_dmn_interpreter.py', 'scripts/validate_process_profile.py', 'scripts/process_executor_v4.py', 'scripts/test_process_library.py', 'scripts/organization_decision_audit.py', 'scripts/corporate_decision_v4.py', 'scripts/budget_escalation_v4.py', 'scripts/corporate_multilevel_v4.py', 'scripts/audit_model_links.py', 'scripts/audit_official_xsd.py', '.github/workflows/process-model-qc.yml']
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_dmn_interpreter.py > dmn-interpreter-qc.json
      - run: python scripts/validate_process_profile.py > process-qc.json
      - run: python scripts/process_executor_v4.py > executor-qc.json
      - run: python scripts/test_process_library.py > library-qc.json
      - run: python scripts/organization_decision_audit.py > decision-audit-qc.json
      - run: python scripts/test_authority_actor.py > authority-actor-qc.json
      - run: python scripts/test_decision_evidence_v2.py > decision-evidence-qc.json
      - run: python scripts/corporate_decision_v4.py > corporate-decision-qc.json
      - run: python scripts/budget_escalation_v4.py > escalation-qc.json
      - run: python scripts/corporate_multilevel_v4.py > multilevel-qc.json
      - run: python scripts/test_nested_process_audit.py > nested-process-qc.json
      - run: python scripts/test_universal_bpmn_engine.py > universal-bpmn-qc.json
      - run: python scripts/test_authoritative_execution.py > authoritative-execution-qc.json
      - run: python scripts/test_event_trace_v1.py > event-trace-qc.json
      - run: python scripts/test_process_replay_v1.py > process-replay-qc.json
      - run: python scripts/test_bpmn_qname.py > bpmn-qname-qc.json
      - run: python scripts/test_semantic_trace_equivalence.py > semantic-trace-qc.json
      - run: python scripts/test_declarative_authority.py > declarative-authority-qc.json
      - run: python scripts/test_extended_negative.py > extended-negative-qc.json
      - run: python scripts/test_task_assignment_v1.py > task-assignment-qc.json
      - run: python scripts/audit_versioned_models.py > process-model-catalog.json
      - run: python scripts/test_task_integrated_execution_v1.py > task-integration-qc.json
      - run: python scripts/test_actor_trace_v1.py > actor-trace-qc.json
      - run: python scripts/test_extended_dmn_negative.py > extended-dmn-qc.json
      - run: python scripts/test_registry_consolidation.py > registry-consolidation-qc.json
      - run: python scripts/test_historical_replay_v1.py > historical-replay-qc.json
      - run: python scripts/test_independent_semantic_audit.py > independent-semantic-qc.json
      - run: python scripts/test_organization_engine_v1.py > organization-engine-qc.json
      - run: python scripts/test_roles_competencies_v1.py > roles-competencies-qc.json
      - run: python scripts/test_temporal_authority_v1.py > temporal-authority-qc.json
      - run: python scripts/test_financial_authority_v1.py > financial-authority-qc.json
      - run: python scripts/test_delegation_authority_v1.py > delegation-authority-qc.json
      - run: python scripts/test_organizational_changes_v1.py > organizational-changes-qc.json
      - run: python scripts/test_event_chronology_v1.py > event-chronology-qc.json
      - run: python scripts/test_organization_process_integration_v1.py > organization-process-integration-qc.json
      - run: python scripts/test_organization_engine_qc_v1.py > organization-engine-baseline-qc.json
      - run: python scripts/organization_engine_qc_v1.py > organization-engine-baseline-report.json
      - run: python scripts/test_organization_integration_audit_v1.py > organization-integration-audit-qc.json
      - run: python scripts/organization_integration_audit_v1.py > organization-integration-audit-report.json
      - run: python scripts/test_event_journal_equivalence_v1.py > event-journal-equivalence-qc.json
      - run: python scripts/test_decision_authority_reconciliation_v1.py > decision-authority-reconciliation-qc.json
      - run: python scripts/audit_model_links.py > model-links-qc.json
      - run: pip install lxml==5.4.0
      - run: |
          set -o pipefail
          python scripts/audit_official_xsd.py | tee official-xsd-qc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-qc
          path: |
            dmn-interpreter-qc.json
            process-qc.json
            executor-qc.json
            library-qc.json
            decision-audit-qc.json
            authority-actor-qc.json
            decision-evidence-qc.json
            corporate-decision-qc.json
            escalation-qc.json
            multilevel-qc.json
            nested-process-qc.json
            universal-bpmn-qc.json
            authoritative-execution-qc.json
            event-trace-qc.json
            process-replay-qc.json
            bpmn-qname-qc.json
            semantic-trace-qc.json
            declarative-authority-qc.json
            extended-negative-qc.json
            task-assignment-qc.json
            process-model-catalog.json
            task-integration-qc.json
            actor-trace-qc.json
            extended-dmn-qc.json
            registry-consolidation-qc.json
            historical-replay-qc.json
            independent-semantic-qc.json
            organization-engine-qc.json
            roles-competencies-qc.json
            temporal-authority-qc.json
            financial-authority-qc.json
            delegation-authority-qc.json
            organizational-changes-qc.json
            event-chronology-qc.json
            organization-process-integration-qc.json
            organization-engine-baseline-qc.json
            organization-engine-baseline-report.json
            organization-integration-audit-qc.json
            organization-integration-audit-report.json
            model-links-qc.json
            official-xsd-qc.json
